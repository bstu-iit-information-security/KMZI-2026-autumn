server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate     /home/tim/lab4/server/fullchain.pem;
    ssl_certificate_key /home/tim/lab4/server/server.key;
    ssl_protocols TLSv1.3;
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384;
    ssl_ecdh_curve P-384;
    ssl_session_tickets on;

    ssl_verify_client on;
    ssl_client_certificate /home/tim/lab4/client/ca-chain.pem;
    ssl_verify_depth 2;

    location / { return 200 'tls13 ok'; }
}
